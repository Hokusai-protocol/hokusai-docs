    # .github/workflows/deploy.yml
    name: Deploy Docs
    on:
      push:
        branches: [ main ]
    jobs:
      deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
          - uses: actions/setup-node@v3
            with: { node-version: '18.x' }
          - run: bash ./deploy-docs.sh
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
